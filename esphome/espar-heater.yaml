# =============================================================================
#  Espar Airtronic S3 CAN Controller
#  Trooper camper project — WeAct CAN485 V1.0  (ESP32-D0WD-V3)
#
#  Hardware:
#    CAN TX: GPIO27    CAN RX: GPIO26    500 kbps
#    XB10 Pin 7 (GYBU) = CAN H
#    XB10 Pin 8 (GNYE) = CAN L
#    XB10 Pin 2 (BRBK) = Ground reference
#    Onboard 120Ω termination switch K3 — leave OFF when tapping mid-bus
#
#  Climate entity behaviour:
#    HEAT mode  — sends HEAT:85°F to heater hardware; thermostat uses the
#                 averaged cabin sensor to turn the heater on/off around the
#                 user's target setpoint. The heater's internal thermocouple
#                 acts only as a safety ceiling.
#    FAN ONLY   — sends FAN command; heater runs blower, no combustion.
#                 Expect ~75s cooldown fan-run after transitioning to OFF.
#    OFF        — sends IDLE command.
#
#  Prerequisites in Home Assistant:
#    Create a template sensor that averages your cabin temperature sensors:
#
#      template:
#        - sensor:
#            - name: "Cabin Average Temperature"
#              unit_of_measurement: "°C"
#              device_class: temperature
#              state: >
#                {{ ( states('sensor.sensor_a') | float(0)
#                   + states('sensor.sensor_b') | float(0) ) / 2 }}
#
#    Then set entity_id below to match.
# =============================================================================

esphome:
  name: espar-heater
  friendly_name: Espar Heater
  on_boot:
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 5%
          blue: 0%
          brightness: 20%

esp32:
  board: esp32dev
  framework:
    type: arduino

# ── Network ──────────────────────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Espar-Heater Fallback Hotspot"
    password: !secret fallback_hotspot_password

# ── Logging ───────────────────────────────────────────────────────────────────
# Use DEBUG during development to see CAN frame activity.
# Switch to INFO for production to reduce log noise.
logger:
  level: DEBUG

# ── External component ────────────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: components
    components: [espar_can]

# ── Captive Portal ────────────────────────────────────────────────────────────
captive_portal:

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:
  # Cabin averaged temperature pulled from HA via API.
  # Update entity_id to match the template sensor you create in HA.
  - platform: homeassistant
    id: cabin_avg_temp
    entity_id: sensor.cabin_average_temperature   # ← update to your HA sensor
    unit_of_measurement: "°F"
    filters:
      - filter_out: nan                            # ignore unavailable readings
      # If your HA sensor reports in °F, keep the line below to convert to °C
      # so the thermostat setpoint (shown in HA as °C) works correctly.
      # Comment it out if your HA sensor already reports in °C.
      - lambda: return (x - 32.0f) * 5.0f / 9.0f;   # °F → °C

  # WiFi signal — useful for placement decisions
  - platform: wifi_signal
    name: "Espar Node WiFi Signal"
    update_interval: 60s

# ── Espar CAN controller ──────────────────────────────────────────────────────
espar_can:
  id: espar
  name: "Espar Heater"

  # Fixed setpoint (°F) sent to the heater hardware when our thermostat
  # decides to heat. Set high so the heater runs continuously; our logic
  # (cabin avg vs. HA climate setpoint) is what turns the heater on and off.
  heat_setpoint_f: 85.0

  # Sensor that provides current cabin temperature to the climate entity.
  # Remove this line if you have no temperature sensor — the component will
  # then heat continuously when mode=HEAT (safe; heater's thermocouple limits it).
  current_temperature_sensor: cabin_avg_temp

  # ── Heater status sensors ──────────────────────────────────────────────
  heater_state:
    name: "Espar Heater State"
    id: espar_heater_state
    icon: mdi:fire
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "HEATING";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 100%
                  green: 30%
                  blue: 0%
                  brightness: 50%
        - if:
            condition:
              lambda: 'return x == "FAN";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 0%
                  green: 0%
                  blue: 100%
                  brightness: 30%
        - if:
            condition:
              lambda: 'return x == "IDLE";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 0%
                  green: 100%
                  blue: 0%
                  brightness: 15%

  flame_active:
    name: "Espar Flame Active"
    id: espar_flame_active
    device_class: heat

  heater_connected:
    name: "Espar Connected"
    id: espar_connected
    device_class: connectivity

  fault_text:
    name: "Espar Fault"
    id: espar_fault
    icon: mdi:alert-circle-outline
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x != "OK";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 100%
                  green: 0%
                  blue: 0%
                  effect: "Fast Pulse"
            else:
              - light.turn_on:
                  id: status_led
                  red: 0%
                  green: 5%
                  blue: 0%
                  brightness: 10%

# ── Onboard WS2812 RGB LED (GPIO4) ───────────────────────────────────────────
# Amber=heating  Blue=fan  Dim green=idle/connected  Red pulse=fault
light:
  - platform: neopixelbus
    name: "Espar Status LED"
    id: status_led
    type: GRB
    variant: WS2812
    pin: GPIO4
    num_leds: 1
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.25s
          update_interval: 0.25s

# ── Diagnostic / housekeeping ─────────────────────────────────────────────────
binary_sensor:
  - platform: status
    name: "Espar Node Status"
    device_class: connectivity

button:
  - platform: restart
    name: "Restart Espar Controller"
    icon: mdi:restart

# ── Web dashboard (optional — remove to save ~40 KB flash) ───────────────────
web_server:
  port: 80

# ── Safe mode (rolls back bad OTA after 10 crash-loops) ──────────────────────
safe_mode:

# ── mDNS ─────────────────────────────────────────────────────────────────────
mdns:
